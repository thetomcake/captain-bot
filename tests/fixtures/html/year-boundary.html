<!--
  Static fixture for US2 (spec 006) — year boundary. Weeks run December -> January in PAGE ORDER
  (chronological), both unplayed. The normaliser's page-order year assignment (T012) must give
  December the anchor year and January the next year. Our team is "White Team": home in December,
  away in January. NOTE: the parser surfaces only month/day — the year is assigned by the normaliser.
-->
<html>
  <body class="logged-in">
    <div class="col">
      <div class="mod">
        <div class="group-header white">Week 8 - December 28th</div>
        <div class="responsive-table">
          <table class="fixture-table">
            <tr class="title no-highlight">
              <td class="title">Game</td>
              <td class="title">Home Team</td>
              <td class="title" colspan="3"></td>
              <td class="title">Away Team</td>
            </tr>
            <tr class="no-highlight">
              <td class="game-week-no" rowspan="1">19:00<br>League</td>
              <td class="team-name"><span class="colourbox white"></span> White Team</td>
              <td class="score home neutral">-</td>
              <td class="versus">v</td>
              <td class="score away neutral">-</td>
              <td class="team-name"><span class="colourbox red"></span> Red team</td>
            </tr>
          </table>
        </div>
      </div>
    </div>

    <div class="col">
      <div class="mod">
        <div class="group-header white">Week 9 - January 4th</div>
        <div class="responsive-table">
          <table class="fixture-table">
            <tr class="title no-highlight">
              <td class="title">Game</td>
              <td class="title">Home Team</td>
              <td class="title" colspan="3"></td>
              <td class="title">Away Team</td>
            </tr>
            <tr class="no-highlight">
              <td class="game-week-no" rowspan="1">19:30<br>League</td>
              <td class="team-name"><span class="colourbox blue"></span> Blue team</td>
              <td class="score home neutral">-</td>
              <td class="versus">v</td>
              <td class="score away neutral">-</td>
              <td class="team-name"><span class="colourbox white"></span> White Team</td>
            </tr>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
